<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Social Video Downloader</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #121212;
    color: #e0e0e0;
    text-align: center;
    padding: 40px 20px;
    margin: 0;
}
.container {
    max-width: 500px;
    margin: auto;
    background: #1e1e1e;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
h2 {
    margin-top: 0;
    color: #fff;
    font-size: 24px;
}
input {
    width: 100%;
    padding: 14px;
    border: 2px solid #333;
    background: #252525;
    color: #fff;
    border-radius: 8px;
    margin-bottom: 15px;
    box-sizing: border-box;
    font-size: 15px;
    transition: border 0.3s;
}
input:focus {
    border-color: #00e676;
    outline: none;
}
button.fetch-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #00c853;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
    transition: background 0.2s;
}
button.fetch-btn:hover {
    background: #00e676;
}
.video-box {
    margin-top: 25px;
    border-top: 1px solid #333;
    padding-top: 20px;
    text-align: left;
}
.video-box h3 {
    font-size: 16px;
    color: #fff;
    margin: 5px 0;
    word-break: break-word;
}
.video-box p {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 15px;
}
video {
    width: 100%;
    border-radius: 10px;
    background: #000;
    margin-top: 5px;
}
.download-btn {
    display: block;
    width: 100%;
    text-align: center;
    box-sizing: border-box;
    margin-top: 15px;
    padding: 14px;
    background: #2979ff;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s;
}
.download-btn:hover {
    background: #29b6f6;
}
.status {
    margin-top: 20px;
    font-weight: bold;
    font-size: 15px;
}
</style>
</head>
<body>

<div class="container">
    <h2>📥 Video Downloader</h2>
    <input type="text" id="videoUrl" placeholder="Paste Facebook / TikTok / Instagram URL">
    <button class="fetch-btn" onclick="downloadVideo()">Get Video</button>
    
    <div id="result"></div>
</div>

<script>
async function downloadVideo() {
    const url = document.getElementById("videoUrl").value.trim();
    const result = document.getElementById("result");

    if(!url){
        alert("Please enter a valid video URL");
        return;
    }

    result.innerHTML = "<div class='status'>⏳ Fetching video data...</div>";

    try {
        // Dynamic Universal API Endpoint
        const api = `https://api.vytal.my.id/download?url=${encodeURIComponent(url)}`;

        const res = await fetch(api);
        
        if (!res.ok) {
            throw new Error("Server error");
        }
        
        const data = await res.json();

        // Dynamic properties handler
        const video = data.result?.videoUrl || data.result?.hd || data.result?.url || data.result?.sd;
        const title = data.result?.title || "Social Video";
        const platform = data.result?.source || "Social Media";

        if(!video){
            result.innerHTML = "<div class='status' style='color:#ff5252;'>❌ Video not found or Link invalid!</div>";
            return;
        }

        result.innerHTML = `
        <div class="video-box">
            <h3>📝 ${title}</h3>
            <p>📌 Platform: <strong>${platform.toUpperCase()}</strong></p>

            <video controls autoplay id="mainPlayer">
                <source src="${video}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <button class="download-btn" onclick="forceDownload('${video}', '${title}')">
               ⬇ Download Video Directly
            </button>
        </div>
        `;
        
        // Caching block clear dynamically
        document.getElementById("mainPlayer")?.load();

    } catch(err){
        console.error(err);
        result.innerHTML = "<div class='status' style='color:#ff5252;'>❌ API Server Error! Try another link.</div>";
    }
}

// Custom function ensuring direct downloads bypassing modern browser CORS blockages
async function forceDownload(videoUrl, filename) {
    try {
        const btn = document.querySelector('.download-btn');
        const originalText = btn.innerText;
        btn.innerText = "⏳ Downloading...";
        btn.style.pointerEvents = "none";

        const response = await fetch(videoUrl);
        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = `${filename.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.mp4`;
        document.body.appendChild(a);
        a.click();
        
        // Clean temporary resources
        document.body.removeChild(a);
        window.URL.revokeObjectURL(blobUrl);
        
        btn.innerText = originalText;
        btn.style.pointerEvents = "auto";
    } catch (error) {
        // Fallback strategy if blob fetch is natively protected
        window.open(videoUrl, '_blank');
        const btn = document.querySelector('.download-btn');
        btn.innerText = "⬇ Download Video Directly";
        btn.style.pointerEvents = "auto";
    }
}
</script>

</body>
</html>
