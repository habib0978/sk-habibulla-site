<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Video Downloader</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#0f172a,#1e293b);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:700px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.15);
border-radius:24px;
padding:30px;
box-shadow:0 15px 40px rgba(0,0,0,.3);
color:#fff;
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo h1{
font-size:32px;
font-weight:700;
}

.logo p{
opacity:.8;
font-size:14px;
margin-top:5px;
}

.input-box{
display:flex;
gap:10px;
margin-top:20px;
}

input{
flex:1;
padding:15px;
border:none;
outline:none;
border-radius:14px;
background:rgba(255,255,255,.1);
color:#fff;
font-size:15px;
}

input::placeholder{
color:#cbd5e1;
}

button{
padding:15px 25px;
border:none;
border-radius:14px;
cursor:pointer;
font-weight:600;
background:#3b82f6;
color:white;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
}

#result{
margin-top:25px;
}

.card{
background:rgba(255,255,255,.08);
border-radius:18px;
padding:18px;
}

video{
width:100%;
border-radius:14px;
margin-top:15px;
}

.download{
display:inline-block;
margin-top:15px;
padding:12px 22px;
border-radius:12px;
text-decoration:none;
background:#22c55e;
color:#fff;
font-weight:600;
}

.info{
margin-top:10px;
font-size:14px;
opacity:.9;
}

.loading{
text-align:center;
padding:20px;
}

@media(max-width:600px){
.input-box{
flex-direction:column;
}
button{
width:100%;
}
}
</style></head>
<body><div class="container"><div class="logo">
<h1>🎬 Video Downloader</h1>
<p>Facebook • Instagram • TikTok • More</p>
</div><div class="input-box">
<input type="text" id="videoUrl" placeholder="Paste your video link here...">
<button onclick="downloadVideo()">Download</button>
</div><div id="result"></div></div><script>
async function downloadVideo(){

const url=document.getElementById("videoUrl").value.trim();
const result=document.getElementById("result");

if(!url){
alert("Please enter a video URL");
return;
}

result.innerHTML='<div class="loading">⏳ Fetching video...</div>';

try{

const res=await fetch(
`https://mahabub-apis.fun/mahabub/dl?url=${encodeURIComponent(url)}`
);

const data=await res.json();

const video=data.hd||data.sd;

if(!video){
result.innerHTML="❌ Video not found!";
return;
}

result.innerHTML=`
<div class="card">

<h3>${data.title || "Untitled Video"}</h3>

<div class="info">
📌 Platform: ${data.platform || "Unknown"}
</div>

<video controls>
<source src="${video}" type="video/mp4">
</video>

<a class="download" href="${video}" download>
⬇ Download HD Video
</a>

</div>
`;

}catch(err){
console.log(err);
result.innerHTML="❌ Failed to load video.";
}

}
</script></body>
</html>
