<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Downloader</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    width:95%;
    max-width:420px;
    background:#fff;
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#2563eb;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:15px;
    margin-bottom:15px;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}

.progress{
    width:100%;
    height:12px;
    background:#ddd;
    border-radius:20px;
    margin-top:20px;
    overflow:hidden;
    display:none;
}

.bar{
    width:0%;
    height:100%;
    background:#22c55e;
    transition:.3s;
}

.status{
    text-align:center;
    margin-top:12px;
    font-size:15px;
    color:#555;
}
</style>
</head>

<body>

<div class="box">

<h2>🎬 Video Downloader</h2>

<input
id="url"
type="text"
placeholder="Paste video link...">

<button onclick="downloadVideo()">
Download Video
</button>

<div class="progress" id="progress">
<div class="bar" id="bar"></div>
</div>

<div class="status" id="status"></div>

</div>

<script>

const API="http://localhost:3001";

async function downloadVideo(){

const url=document.getElementById("url").value;

if(!url){
alert("Paste a video link.");
return;
}

document.getElementById("progress").style.display="block";
document.getElementById("status").innerHTML="Starting...";

const res=await fetch(API+"/download/video",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

url:url,

quality:"720",

extension:"mp4"

})

});

const data=await res.json();

const es=new EventSource(API+"/download/"+data.downloadId+"/progress");

es.onmessage=(e)=>{

const msg=JSON.parse(e.data);

if(msg.type==="progress"){

document.getElementById("bar").style.width=
msg.data.percentage+"%";

document.getElementById("status").innerHTML=
msg.data.percentage+"% Downloading...";

}

if(msg.type==="complete"){

document.getElementById("status").innerHTML=
"✅ Download Ready";

window.location.href=msg.data;

es.close();

}

if(msg.type==="error"){

alert(msg.message);

es.close();

}

};

}

</script>

</body>
</html>
