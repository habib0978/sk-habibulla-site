<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .downloader-container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #00adb5;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #393e46;
            border-radius: 6px;
            background-color: #222831;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #00adb5;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00adb5;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #007a80;
        }
        .loader {
            display: none;
            margin: 15px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #00adb5;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result-container {
            margin-top: 20px;
            word-wrap: break-word;
        }
        .download-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
        }
        .download-btn:hover {
            background-color: #218838;
        }
        .error {
            color: #dc3545;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="downloader-container">
    <h2>Video Downloader</h2>
    <input type="text" id="videoUrl" placeholder="Paste video link here...">
    <button onclick="downloadVideo()">Fetch Video</button>

    <div class="loader" id="loader"></div>
    <div class="result-container" id="result"></div>
</div>

<script>
    async function downloadVideo() {
        const videoUrl = document.getElementById('videoUrl').value.trim();
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');

        // ইনপুট ভ্যালিডেশন
        if (!videoUrl) {
            resultDiv.innerHTML = '<p class="error">Please paste a valid URL first!</p>';
            return;
        }

        // লোডার চালু করা এবং আগের রেজাল্ট ক্লিয়ার করা
        loader.style.display = 'block';
        resultDiv.innerHTML = '';

        // API URL তৈরি করা
        const apiUrl = `https://mahabub-apis.fun/mahabub/dl?url=${encodeURIComponent(videoUrl)}`;

        try {
            const response = await fetch(apiUrl);
            const data = await response.json();

            loader.style.display = 'none';

            // API রেসপন্স চেক করা (আপনার API এর JSON স্ট্রাকচার অনুযায়ী এটি পরিবর্তন করতে হতে পারে)
            if (data && (data.result || data.url || data.downloadUrl)) {
                // এখানে ধরে নেওয়া হয়েছে API রেসপন্সে 'result' বা 'url' ফিল্ডে ডাউনলোড লিঙ্ক থাকে
                const downloadLink = data.result || data.url || data.downloadUrl;
                
                resultDiv.innerHTML = `
                    <p style="color: #28a745;">Video fetched successfully!</p>
                    <a href="${downloadLink}" target="_blank" class="download-btn" download>Download Video</a>
                `;
            } else {
                resultDiv.innerHTML = '<p class="error">Failed to get download link. Check the URL or API response.</p>';
            }

        } catch (error) {
            loader.style.display = 'none';
            resultDiv.innerHTML = '<p class="error">An error occurred while fetching the video. Please try again.</p>';
            console.error('Error:', error);
        }
    }
</script>

</body>
</html>
