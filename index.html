<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habib Downloader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow-x: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; color: #00ff00; }
        canvas { position: fixed; top: 0; left: 0; z-index: 1; }

        /* Main Container */
        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 25px;
            border: 2px solid #00ff00;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            width: 90%;
            max-width: 450px;
        }

        .terminal-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
        
        input {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
        }

        .btn-cyber {
            background: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 10px 20px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            transition: 0.3s;
        }

        .btn-cyber:hover { background: #00ff00; color: #000; }
        
        #result { margin-top: 20px; font-size: 0.9rem; }
        video { width: 100%; margin-top: 10px; border: 1px solid #00ff00; }
        .download-btn { display: block; margin-top: 10px; padding: 10px; background: #00ff00; color: #000; text-decoration: none; font-weight: bold; text-align: center; }

        /* Creator Profile Section */
        .operator-profile {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed #00ff00;
            text-align: left;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .profile-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
            object-fit: cover;
        }
        .profile-info h4 {
            color: #ffffff;
            font-size: 1rem;
        }
        .profile-info p {
            color: #00ff00;
            font-size: 0.8rem;
        }
        
        /* Contact Buttons Styling */
        .profile-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        .btn-contact {
            flex: 1;
            display: inline-block;
            text-align: center;
            padding: 8px;
            background: transparent;
            color: #00ff00;
            border: 1px solid #00ff00;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-contact:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.5);
        }

        /* Bottom Credit Text */
        .credit-footer {
            text-align: center;
            font-size: 0.85rem;
            color: #00ff00;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 5px;
            opacity: 0.8;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; text-shadow: 0 0 5px #00ff00; }
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="container">
        <!-- Title Change Applied Below -->
        <div class="terminal-text">> HABIB DOWNLOADER 📥_</div>
        
        <!-- Downloader Input -->
        <input type="text" id="videoUrl" placeholder="Paste Video URL Here...">
        <button class="btn-cyber" onclick="downloadVideo()">EXTRACT VIDEO</button>

        <!-- Video Result Area -->
        <div id="result"></div>

        <!-- Creator Profile Section -->
        <div class="operator-profile">
            <div class="profile-header">
                <img class="profile-img" src="https://i.imgur.com/DSqgcku.jpeg" alt="Sk Habib">
                <div class="profile-info">
                    <h4>Owner: Habib</h4>
                    <p>[+] Mainframe Access Locked</p>
                </div>
            </div>
            
            <!-- Contact Buttons -->
            <div class="profile-buttons">
                <a class="btn-contact" href="https://wa.me/918327378209" target="_blank">🟢 WHATSAPP</a>
                <a class="btn-contact" href="mailto:hsk467459@gmail.com">✉️ EMAIL</a>
            </div>

            <!-- Footer Credit Line -->
            <div class="credit-footer">
                Created by 💝Sk Habib
            </div>
        </div>
    </div>

    <script>
        // Matrix Effect
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*'.split('');
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const rainDrops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff00';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) rainDrops[i] = 0;
                rainDrops[i]++;
            }
        }
        setInterval(draw, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Download Logic
        async function downloadVideo() {
            const url = document.getElementById("videoUrl").value.trim();
            const result = document.getElementById("result");
            if(!url) return alert("Enter valid URL");
            
            result.innerHTML = "⏳ Bypassing firewall & extracting...";
            try {
                const res = await fetch(`https://mahabub-apis.fun/mahabub/dl?url=${encodeURIComponent(url)}`);
                const data = await res.json();
                const video = data.hd || data.sd;
                if(!video) return result.innerHTML = "❌ Video not found.";
                
                result.innerHTML = `
                    <video controls src="${video}"></video>
                    <a class="download-btn" href="${video}" download target="_blank">DOWNLOAD NOW</a>
                `;
            } catch(e) { result.innerHTML = "❌ Error securing content."; }
        }
    </script>
</body>
</html>
