<script>
// রিয়েল-টাইম টার্মিনাল ঘড়ি এবং ডেট
function updateClock(){
    let now = new Date();
    
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const year = now.getFullYear();
    document.getElementById("date").innerText = `DATE: ${day}/${month}/${year}`;
    
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12; 
    const strHours = String(hours).padStart(2, '0');
    
    document.getElementById("time").innerText = `TIME: ${strHours}:${minutes}:${seconds} ${ampm}`;
}
setInterval(updateClock, 1000);
updateClock();

// ডাউনলোড হিস্ট্রি স্টোরেজ কন্ট্রোল
function saveHistory(url){
    let h = JSON.parse(localStorage.getItem("h")||"[]");
    h.unshift(url);
    localStorage.setItem("h", JSON.stringify(h.slice(0, 10)));
    loadHistory();
}

function loadHistory(){
    let h = JSON.parse(localStorage.getItem("h")||"[]");
    document.getElementById("history").innerHTML =
    h.map(x => `<div class="history-item">> INJECTED: ${x}</div>`).join("");
}

// ব্যাকগ্রাউন্ডের টক্সিক নিউক্লিয়ার ম্যাট্রিক্স ইফেক্ট
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');

function setCanvasSize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
setCanvasSize();
window.addEventListener('resize', setCanvasSize);

const alphabet = '01¼½☢☣⚠️☠⚡𝌡𝌟#$@*&%'.split('');
const fontSize = 14;
const columns = canvas.width / fontSize;
const rainDrops = Array(Math.floor(columns)).fill(1);

function draw() {
    ctx.fillStyle = 'rgba(3, 5, 0, 0.06)'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet[Math.floor(Math.random() * alphabet.length)];
        
        const rand = Math.random();
        if(rand > 0.75) {
            ctx.fillStyle = '#ffffff'; 
        } else if(rand > 0.25) {
            ctx.fillStyle = '#fff200'; 
        } else {
            ctx.fillStyle = '#00ff66'; 
        }
        
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.98) rainDrops[i] = 0;
        rainDrops[i]++;
    }
}
setInterval(draw, 33);

// কোর ডাউনলোড এক্সট্রাকশন লজিক
async function downloadVideo(){
    let url = document.getElementById("url").value.trim();
    let format = document.getElementById("format").value;
    let result = document.getElementById("result");

    if(!url){
        alert("Injection URL Missing!");
        return;
    }

    result.innerHTML = "<span style='color: #fff200; display:block; margin-top:10px; font-weight:bold;'>☣️ Overriding server nodes & extracting payload...</span>";

    try {
        let res = await fetch(`https://mahabub-apis.fun/mahabub/dl?url=${encodeURIComponent(url)}`);
        let data = await res.json();
        let media;

        if(format === "mp3"){
            media = data.mp3 || data.audio;
        } else {
            media = data.hd || data.sd;
        }

        if(!media){
            result.innerHTML = "<span style='color: #00ff66; display:block; margin-top:10px;'>❌ Target payload not found.</span>";
            return;
        }

        if(format === "mp3"){
            result.innerHTML = `
                <audio controls src="${media}"></audio>
                <a class="download-btn" href="${media}" download target="_blank">🧪 DOWNLOAD MP3 DATA</a>
            `;
        } else {
            result.innerHTML = `
                <video controls src="${media}"></video>
                <a class="download-btn" href="${media}" download target="_blank">🧪 DOWNLOAD MP4 PAYLOAD</a>
            `;
        }

        saveHistory(url);

    } catch(e) {
        result.innerHTML = "<span style='color: #00ff66; display:block; margin-top:10px;'>❌ Host firewall rejected connection.</span>";
    }
}
