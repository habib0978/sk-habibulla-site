<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Habib Downloader Pro</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(
-45deg,
#0f172a,
#111827,
#1e293b,
#0f172a
);
background-size:400% 400%;
animation:bg 10s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.card{
width:95%;
max-width:450px;
padding:25px;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.2);
box-shadow:0 0 30px rgba(0,255,255,.2);
}

.logo{
text-align:center;
font-size:28px;
font-weight:bold;
color:#00ffff;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
border:none;
outline:none;
border-radius:12px;
background:#111827;
color:white;
margin-bottom:15px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#00ffff;
color:#000;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.03);
box-shadow:0 0 20px #00ffff;
}

.result{
margin-top:20px;
}

video{
width:100%;
border-radius:15px;
margin-top:15px;
}

.download{
display:block;
margin-top:10px;
padding:12px;
background:#22c55e;
text-align:center;
border-radius:10px;
text-decoration:none;
color:white;
font-weight:bold;
}

.profile{
display:flex;
align-items:center;
margin-top:25px;
padding-top:15px;
border-top:1px solid rgba(255,255,255,.2);
}

.profile img{
width:55px;
height:55px;
border-radius:50%;
margin-right:12px;
border:2px solid #00ffff;
}

.name{
color:white;
font-weight:bold;
}

.role{
font-size:12px;
color:#00ffff;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
⚡ HABIB DOWNLOADER PRO
</div>

<input type="text" id="url"
placeholder="Paste Video URL">

<button onclick="downloadVideo()">
DOWNLOAD VIDEO
</button>

<div id="result" class="result"></div>

<div class="profile">
<img src="https://i.imgur.com/DSqgcku.jpeg">
<div>
<div class="name">SK HABIB</div>
<div class="role">Developer & Owner</div>
</div>
</div>

</div>

<script>
async function downloadVideo(){

let url=document.getElementById("url").value;
let result=document.getElementById("result");

result.innerHTML="⏳ Processing...";

try{

let res=await fetch(
`https://mahabub-apis.fun/mahabub/dl?url=${encodeURIComponent(url)}`
);

let data=await res.json();

let video=data.hd || data.sd;

result.innerHTML=`
<video controls src="${video}"></video>
<a class="download" href="${video}" download>
⬇ Download Now
</a>
`;

}catch{

result.innerHTML="❌ Failed";

}
}
</script>

</body>
</html>
