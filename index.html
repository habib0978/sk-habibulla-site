        /* GLOBAL STYLE & GLASS UI   */
        /* ========================= */
        * {

            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', 'Noto Sans Bengali', sans-serif;
            background: #020617;
            overflow-x: hidden;
            color: white;
            position: relative;
            min-height: 100vh;
        }

        /* VIDEO BACKGROUND */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.45;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.3) 0%, rgba(2, 6, 23, 0.8) 100%);
            z-index: -1;
        }

        /* MOON EFFECT */
        .moon {
            position: absolute;
            top: 40px;
            right: 50px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            box-shadow: -15px 15px 0 0 #fde047;
            animation: moonGlow 4s infinite alternate;
        }
        @keyframes moonGlow {
            from { filter: drop-shadow(0 0 15px rgba(253, 224, 71, 0.4)); }
            to { filter: drop-shadow(0 0 30px rgba(253, 224, 71, 0.8)); }
        }

        /* STARS */
        .stars span {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            opacity: .7;
            animation: twinkle 3s infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: .2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* ========================= */
        /* PREMIUM GLASS CONTAINER   */
        /* ========================= */
        .container {
            position: relative;
            z-index: 2;
            width: 92%;
            max-width: 700px;
            margin: 50px auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            backdrop-filter: blur(16px) saturate(120%);
            -webkit-backdrop-filter: blur(16px) saturate(120%);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255,255,255,0.1);
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        }

            font-weight: 700;
            border-radius: 12px;

        .dl-btn:hover {
            transform: translateY(-2px);

            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;

            border-radius: 10px;
            transition: width 0.4s ease;

            margin: 10px 0;

        .download-actions {

        .action-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* ====================== */

        /* ====================== */
        .interaction-area {
            display: flex;
            justify-content: center;
            gap: 15px;

        .share-box-btn:hover, .like-btn:hover {

        .bar {

        .fill {
            height: 100%;

            background: linear-gradient(90deg, #3b82f6, #22c55e);
            width: 0;
            transition: width 1.5s cubic-bezier(0.1, 1, 0.1, 1);

        .footer { margin-top: 40px; color: #64748b; font-size: 13px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 20px; }

        @media(max-width:600px){

            .copy-btn { grid-column: span 1; }
            .btn { width: 44px; height: 44px; font-size: 16px; }
        }
    </style>
</head>
