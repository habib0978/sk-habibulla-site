<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader | SK HABIBULLA</title>
    
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* ========================= */
        /*        GLOBAL STYLE       */
        /* ========================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #03001e; /* রিচ ডার্ক পার্পল ব্যাকগ্রাউন্ড */
            overflow-x: hidden;
            color: white;
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ব্যাকগ্রাউন্ডে মাল্টিপল কালারফুল নিওন গ্লো */
        body::before {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #ff007f);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            filter: blur(160px);
            opacity: 0.35;
            z-index: 0;
            animation: pulseGlow 8s infinite alternate;
        }

        body::after {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #7f00ff, #ff007f, #ff00cc);
            bottom: -50px;
            right: -50px;
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.3;
            z-index: 0;
            animation: pulseGlow 6s infinite alternate-reverse;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(30px, 20px); }
        }

        /* ========================= */
        /*           MOON            */
        /* ========================= */
        .moon {
            position: fixed;
            top: 60px;
            right: 80px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            box-shadow: -20px 0 0 #00f2fe;
            animation: moonGlow 4s infinite alternate;
            z-index: 1;
        }

        @keyframes moonGlow {
            from { filter: drop-shadow(0 0 15px #00f2fe) hue-rotate(0deg); }
            to { filter: drop-shadow(0 0 35px #ff007f) hue-rotate(90deg); }
        }

        /* ========================= */
        /*           STARS           */
        /* ========================= */
        .stars span {
            position: fixed;
            width: 3px;
            height: 3px;
            background: #00ffcc;
            border-radius: 50%;
            opacity: .7;
            animation: twinkle 2s infinite alternate;
            z-index: 1;
        }

        @keyframes twinkle {
            0% { opacity: .2; transform: scale(0.8); background: #00ffcc; }
            50% { background: #ff007f; }
            100% { opacity: 1; transform: scale(1.4); filter: drop-shadow(0 0 5px #00f2fe); }
        }

        .stars span:nth-child(1) { top: 12%; left: 15%; animation-delay: 0.2s; }
        .stars span:nth-child(2) { top: 22%; left: 78%; animation-delay: 0.5s; }
        .stars span:nth-child(3) { top: 68%; left: 10%; animation-delay: 0.8s; }
        .stars span:nth-child(4) { top: 75%; left: 85%; animation-delay: 1.1s; }
        .stars span:nth-child(5) { top: 30%; left: 92%; animation-delay: 0.4s; }
        .stars span:nth-child(6) { top: 45%; left: 42%; animation-delay: 1.5s; }
        .stars span:nth-child(7) { top: 18%; left: 52%; animation-delay: 0.9s; }

        /* ========================= */
        /*         CONTAINER         */
        /* ========================= */
        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 600px;
            margin: auto;
            padding: 40px 0;
        }

        /* ========================= */
        /*           CARD            */
        /* ========================= */
        .card {
            background: rgba(15, 12, 38, 0.5);
            border: 2px solid rgba(0, 242, 254, 0.2);
            border-radius: 30px;
            padding: 40px 35px;
            text-align: center;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 50px rgba(0, 242, 254, 0.15), 0 0 30px rgba(255, 0, 127, 0.1);
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card:hover {
            border-color: rgba(255, 0, 127, 0.4);
            box-shadow: 0 20px 60px rgba(255, 0, 127, 0.25), 0 0 40px rgba(0, 242, 254, 0.15);
            transform: translateY(-2px);
        }

        /* ========================= */
        /*        DOWNLOADER UI      */
        /* ========================= */
        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .dl-icon {
            width: 42px;
            height: 42px;
            fill: url(#rainbow-gradient);
            filter: drop-shadow(0 2px 12px rgba(0, 242, 254, 0.6));
            animation: bounceIcon 2s infinite ease-in-out;
        }

        @keyframes bounceIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .title {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #ff007f, #ff00cc);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 15px rgba(0, 242, 254, 0.4));
            font-family: 'Noto Sans Bengali', sans-serif;
            animation: shineText 4s linear infinite;
        }

        @keyframes shineText {
            to { background-position: 200% center; }
        }

        .input-group {
            margin-bottom: 22px;
        }

        input {
            width: 100%;
            padding: 18px 25px;
            border: 2px solid rgba(0, 242, 254, 0.2);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.03);
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.4s;
            text-align: center;
            letter-spacing: 0.5px;
        }

        input:focus {
            border-color: #ff007f;
            background: rgba(10, 5, 30, 0.9);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5), inset 0 0 10px rgba(0, 242, 254, 0.2);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* ওয়াইড রেঞ্জ ভাইব্রেন্ট বাটন */
        .get-btn {
            border: none;
            padding: 16px 35px;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            color: white;
            background: linear-gradient(45deg, #ff007f, #7f00ff, #00f2fe);
            background-size: 200% auto;
            box-shadow: 0 6px 25px rgba(255, 0, 127, 0.45);
            transition: 0.4s ease;
            width: 100%;
            letter-spacing: 1px;
        }

        .get-btn:hover {
            transform: translateY(-3px);
            background-position: right center;
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.5);
        }

        /* ========================= */
        /*        RESULT BOX         */
        /* ========================= */
        #result {
            margin-top: 30px;
        }

        .video-box {
            background: rgba(255, 255, 255, 0.02);
            padding: 25px;
            border-radius: 22px;
            border: 2px solid rgba(0, 242, 254, 0.25);
            box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.05);
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .video-box h3 {
            font-size: 17px;
            margin-bottom: 12px;
            color: #f1f1f1;
            line-height: 1.4;
        }

        .video-box p {
            font-size: 14px;
            color: #00ffcc;
            margin-bottom: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        video {
            width: 100%;
            border-radius: 15px;
            border: 2px solid rgba(255, 0, 127, 0.3);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .download-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: linear-gradient(45deg, #00ffcc, #0099ff, #7f00ff);
            background-size: 200% auto;
            color: #03001e;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 17px;
            box-shadow: 0 6px 25px rgba(0, 255, 204, 0.45);
            width: 100%;
            transition: 0.4s;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            background-position: right center;
            box-shadow: 0 10px 30px rgba(0, 153, 255, 0.6);
            color: white;
        }

        .status-msg {
            font-size: 16px;
            color: #00f2fe;
            margin-top: 15px;
            font-weight: 600;
            text-shadow: 0 0 12px rgba(0, 242, 254, 0.4);
        }

        /* ========================= */
        /*          FOOTER           */
        /* ========================= */
        .footer {
            margin-top: 30px;
            color: #777;
            font-size: 13px;
            letter-spacing: 1px;
        }
        
        .footer-name {
            background: linear-gradient(45deg, #00ffcc, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.1);
        }

        @media(max-width:600px) {
            .card { padding: 30px 20px; border-radius: 20px; }
            .title { font-size: 2.1rem; }
            .dl-icon { width: 34px; height: 34px; }
            .moon { width: 65px; height: 65px; top: 25px; right: 25px; }
        }
    </style>
</head>

<body>

    <!-- RAINBOW GRADIENT DEFINITION FOR SVG -->
    <svg width="0" height="0" style="position: absolute;">
        <defs>
            <linearGradient id="rainbow-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f2fe" />
                <stop offset="35%" stop-color="#4facfe" />
                <stop offset="70%" stop-color="#ff007f" />
                <stop offset="100%" stop-color="#ff00cc" />
            </linearGradient>
        </defs>
    </svg>

    <!-- MOON & STARS -->
    <div class="moon"></div>
    <div class="stars">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="container">
        <div class="card">
            
            <!-- টাইটেল এবং এনিমেটেড কালারফুল আইকন -->
            <div class="title-wrapper">
                <svg class="dl-icon" viewBox="0 0 24 24">
                    <path d="M5 20h14v-2H5v2zm7-18L5.33 11h4V16h5.34v-5h4L12 2z"/>
                </svg>
                <div class="title">ভিডিও ডাউনলোডার</div>
            </div>

            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="ফেসবুক / টিকটক / ইনস্টাগ্রাম লিংক পেস্ট করুন">
            </div>

            <button type="button" class="get-btn" onclick="downloadVideo()">ভিডিও খুঁজুন</button>

            <!-- রেজাল্ট দেখানোর এরিয়া -->
            <div id="result"></div>

            <!-- FOOTER -->
            <div class="footer">
                ❤️ Made By <span class="footer-name">SK HABIBULLA</span>
            </div>

        </div>
    </div>

    <script>
        async function downloadVideo() {
            const url = document.getElementById("videoUrl").value.trim();
            const result = document.getElementById("result");

            if (!url) {
                alert("অনুগ্রহ করে একটি লিংক প্রবেশ করান!");
                return;
            }

            result.innerHTML = "<p class='status-msg'>⏳ ভিডিওর তথ্য লোড হচ্ছে...</p>";

            try {
                const api = `https://mahabub-apis.fun/mahabub/dl?url=${encodeURIComponent(url)}`;
                const res = await fetch(api);
                const data = await res.json();

                const videoSrc = data?.hd || data?.sd;

                if (!videoSrc) {
                    result.innerHTML = "<p class='status-msg' style='color:#ff3366; text-shadow: 0 0 10px rgba(255,51,102,0.3);'>❌ ভিডিও পাওয়া যায়নি অথবা লিংকটি সঠিক নয়।</p>";
                    return;
                }

                result.innerHTML = `
                <div class="video-box">
                    <h3>${data.title || "No Title"}</h3>
                    <p>📌 Platform: ${data.platform || "Unknown"}</p>

                    <video controls playsinline>
                        <source src="${videoSrc}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>

                    <button class="download-btn" onclick="triggerDirectDownload('${videoSrc}', '${data.title || 'video'}')">
                       ⬇️ ডাউনলোড করুন
                    </button>
                </div>
                `;

            } catch (err) {
                console.error(err);
                result.innerHTML = "<p class='status-msg' style='color:#ff3366; text-shadow: 0 0 10px rgba(255,51,102,0.3);'>❌ এপিআই ত্রুটি! আবার চেষ্টা করুন।</p>";
            }
        }

        async function triggerDirectDownload(videoUrl, filename) {
            try {
                const btn = document.querySelector('.download-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = "⏳ ডাউনলোড শুরু হচ্ছে...";
                btn.disabled = true;

                const response = await fetch(videoUrl);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `${filename.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.mp4`;
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
                btn.innerHTML = originalText;
                btn.disabled = false;
            } catch (error) {
                console.error("Blob download failed, opening link instead.", error);
                window.open(videoUrl, '_blank');
            }
        }
    </script>

</body>
</html>
