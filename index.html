<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Video Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .main-card {
            background: #1e293b;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
            text-align: center;
            border: 1px solid #334155;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #38bdf8;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background-color: #0f172a;
            border: 2px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.2);
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        .status-box {
            margin-top: 20px;
        }
        #loader {
            display: none;
            color: #38bdf8;
            font-size: 14px;
        }
        #error {
            display: none;
            color: #ef4444;
            font-size: 14px;
        }
        #result-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: #0f172a;
            border-radius: 10px;
            border: 1px solid #22c55e;
        }
        #result-box p {
            color: #22c55e;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .dl-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #22c55e;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        .dl-btn:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

<div class="main-card">
    <h1>All Video Downloader</h1>
    <p>Paste a social media video link to get the download link</p>
    
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="Paste YouTube, TikTok, FB, or Insta link...">
    </div>
    
    <button onclick="startDownload()">Get Video Link</button>

    <div class="status-box">
        <div id="loader">Fetching video stream details... please wait...</div>
        <div id="error"></div>
    </div>

    <div id="result-box">
        <p>✓ Video Found Successfully!</p>
        <a id="downloadLink" href="#" target="_blank" class="dl-btn">Download High Quality MP4</a>
    </div>
</div>

<script>
    async function startDownload() {
        const urlInput = document.getElementById('urlInput').value.trim();
        const loader = document.getElementById('loader');
        const errorDiv = document.getElementById('error');
        const resultBox = document.getElementById('result-box');
        const downloadLink = document.getElementById('downloadLink');

        // UI Reset
        loader.style.display = 'none';
        errorDiv.style.display = 'none';
        resultBox.style.display = 'none';
        errorDiv.innerText = '';

        if (!urlInput) {
            errorDiv.innerText = 'Error: Please enter a URL first!';
            errorDiv.style.display = 'block';
            return;
        }

        loader.style.display = 'block';

        try {
            const response = await fetch('https://api.cobalt.tools/api/json', {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    url: urlInput,
                    videoQuality: '720' // Default high-quality link request
                })
            });

            const data = await response.json();
            loader.style.display = 'none';

            if (data.status === 'stream' || data.status === 'redirect') {
                downloadLink.href = data.url;
                resultBox.style.display = 'block';
            } else {
                errorDiv.innerText = 'Could not parse video. Either link is private or unsupported.';
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            loader.style.display = 'none';
            errorDiv.innerText = 'API Connection Error. Please try again later.';
            errorDiv.style.display = 'block';
            console.error(err);
        }
    }
</script>

</body>
</html>
