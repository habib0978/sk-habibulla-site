            result.innerHTML = "<p class='status-msg'>⏳ ভিডিওর তথ্য লোড হচ্ছে...</p>";

            try {
                const api = `https://mahabub-apis.fun/mahabub/dl?url=${encodeURIComponent(url)}`;
                const res = await fetch(api);
                const data = await res.json();

                const videoSrc = data?.hd || data?.sd;

                if (!videoSrc) {
                    result.innerHTML = "<p class='status-msg' style='color:#ff3366; text-shadow: 0 0 10px rgba(255,51,102,0.3);'>❌ ভিডিও পাওয়া যায়নি অথবা লিংকটি সঠিক নয়।</p>";
                    return;
                }

                result.innerHTML = `
                <div class="video-box">
                    <h3>${data.title || "No Title"}</h3>
                    <p>📌 Platform: ${data.platform || "Unknown"}</p>

                    <video controls playsinline>
                        <source src="${videoSrc}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>

                    <button class="download-btn" onclick="triggerDirectDownload('${videoSrc}', '${data.title || 'video'}')">
                       ⬇️ ডাউনলোড করুন
                    </button>
                </div>
                `;

            } catch (err) {
                console.error(err);
                result.innerHTML = "<p class='status-msg' style='color:#ff3366; text-shadow: 0 0 10px rgba(255,51,102,0.3);'>❌ এপিআই ত্রুটি! আবার চেষ্টা করুন।</p>";
            }
        }

        async function triggerDirectDownload(videoUrl, filename) {
            try {
                const btn = document.querySelector('.download-btn');
                const originalText = btn.innerHTML;
                btn.innerHTML = "⏳ ডাউনলোড শুরু হচ্ছে...";
                btn.disabled = true;

                const response = await fetch(videoUrl);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `${filename.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.mp4`;
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
                btn.innerHTML = originalText;
                btn.disabled = false;
            } catch (error) {
                console.error("Blob download failed, opening link instead.", error);
                window.open(videoUrl, '_blank');
            }
        }
    </script>

</body>
</html>
